<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <style>
      .title{font-size:20px;font-weight:700;fill:#3D2B1F}
      .name{font-size:13px;font-weight:700;fill:#3D2B1F}
      .sub{font-size:11px;fill:#7A6857}
      .lbl{font-size:12px;fill:#4A3728}
      .cond{fill:#FFFBF5;stroke:#8B5E3C;stroke-width:2}
      .act{fill:#F2EBDE;stroke:#B8845A;stroke-width:1.5}
      .warn{fill:#BF4B3A;opacity:0.08}
      .arrow{stroke:#8B5E3C;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5E3C"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" class="title">安全体系 · 看门狗状态机（谁在什么时候保护你）</text>

  <!-- 正常状态 -->
  <rect x="60" y="60" width="200" height="90" rx="14" class="cond"/>
  <text x="160" y="90" text-anchor="middle" class="name">✅ 正常烘焙中</text>
  <text x="160" y="112" text-anchor="middle" class="lbl">主控在线（App 或网页）</text>
  <text x="160" y="130" text-anchor="middle" class="lbl">SV 由主控或跟随引擎管理</text>
  <text x="160" y="145" text-anchor="middle" class="sub">绿灯 / 青闪（有客户端）</text>

  <!-- 主控失联 -->
  <rect x="360" y="60" width="220" height="90" rx="14" class="cond"/>
  <text x="470" y="90" text-anchor="middle" class="name">⚡ 主控失联</text>
  <text x="470" y="112" text-anchor="middle" class="lbl">App 崩溃 / 手机锁屏断连 /</text>
  <text x="470" y="130" text-anchor="middle" class="lbl">WiFi 掉线 / 手动关闭</text>
  <text x="470" y="145" text-anchor="middle" class="sub">触发条件：无主控（非无连接）</text>

  <!-- 30s 倒计时 -->
  <rect x="360" y="210" width="220" height="100" rx="14" fill="#FFF8E8" stroke="#D4843A" stroke-width="2.5"/>
  <text x="470" y="240" text-anchor="middle" class="name" fill="#D4843A">⏳ 30 秒倒计时</text>
  <text x="470" y="262" text-anchor="middle" class="lbl">旁观者网页弹横幅：</text>
  <text x="470" y="280" text-anchor="middle" class="lbl">「主控失联，30s 后进入安全模式」</text>
  <text x="470" y="300" text-anchor="middle" class="name" fill="#8B5E3C">此时点「接管」= 完全拯救</text>

  <!-- 安全模式一段 -->
  <rect x="360" y="370" width="220" height="110" rx="14" fill="#BF4B3A" opacity="0.1"/>
  <rect x="360" y="370" width="220" height="110" rx="14" fill="none" stroke="#BF4B3A" stroke-width="2.5"/>
  <text x="470" y="398" text-anchor="middle" class="name" fill="#BF4B3A">🛡 安全模式（一段保温）</text>
  <text x="470" y="420" text-anchor="middle" class="lbl">SV 写 70°C（可配置 60~80）</text>
  <text x="470" y="438" text-anchor="middle" class="lbl">风机 30%（可配置）</text>
  <text x="470" y="456" text-anchor="middle" class="lbl">粘性：重连不自动恢复</text>
  <text x="470" y="474" text-anchor="middle" class="sub">红常亮灯 · 防烤坏豆不失控</text>

  <!-- 二段熄火 -->
  <rect x="680" y="370" width="220" height="110" rx="14" fill="#BF4B3A" opacity="0.18"/>
  <rect x="680" y="370" width="220" height="110" rx="14" fill="none" stroke="#BF4B3A" stroke-width="3"/>
  <text x="790" y="398" text-anchor="middle" class="name" fill="#BF4B3A">🔥 二段熄火（默认开）</text>
  <text x="790" y="420" text-anchor="middle" class="lbl">保温 10 分钟后 SV=0</text>
  <text x="790" y="438" text-anchor="middle" class="lbl">风机维持 30% 散余热</text>
  <text x="790" y="456" text-anchor="middle" class="lbl">彻底停火，防止过夜保温</text>
  <text x="790" y="474" text-anchor="middle" class="sub">橙闪灯 · 参数均可配置</text>

  <!-- 恢复 -->
  <rect x="680" y="210" width="220" height="100" rx="14" class="act"/>
  <text x="790" y="240" text-anchor="middle" class="name">🔄 恢复（显式）</text>
  <text x="790" y="262" text-anchor="middle" class="lbl">重连后主控必须 sv_set 显式写 SV</text>
  <text x="790" y="280" text-anchor="middle" class="lbl">或 App 弹窗选择「继续跟随/切手动」</text>
  <text x="790" y="300" text-anchor="middle" class="sub">自动恢复被禁止 = 防回温事故</text>

  <!-- 箭头 -->
  <path d="M 260 105 L 358 105" class="arrow"/>
  <text x="300" y="95" class="lbl">失联</text>
  <path d="M 470 150 L 470 208" class="arrow"/>
  <text x="478" y="182" class="lbl">立即开始倒计时</text>
  <path d="M 470 310 L 470 368" class="arrow"/>
  <text x="478" y="342" class="lbl">30s 无人接管</text>
  <path d="M 580 425 L 678 425" class="arrow"/>
  <text x="596" y="415" class="lbl">再等 10 分钟</text>
  <path d="M 680 260 C 560 260, 520 300, 480 368" class="arrow"/>
  <text x="545" y="290" class="lbl" fill="#55804B">有人接管/主控重连</text>
  <path d="M 790 370 C 790 330, 700 310, 582 270" class="arrow" stroke-dasharray="5,3"/>
  <text x="640" y="330" class="lbl" fill="#55804B">显式 sv_set 恢复</text>

  <!-- 跟随说明 -->
  <rect x="60" y="210" width="220" height="100" rx="14" fill="#F2EBDE" stroke="#5AA7C4" stroke-width="2"/>
  <text x="170" y="238" text-anchor="middle" class="name" fill="#1F7A8C">🔄 跟随引擎运行时</text>
  <text x="170" y="260" text-anchor="middle" class="lbl">看门狗挂起（跟随自带保护）</text>
  <text x="170" y="278" text-anchor="middle" class="lbl">脱轨熔断：PV 偏离目标 >15°C</text>
  <text x="170" y="296" text-anchor="middle" class="lbl">持续 30s → 直接进安全模式</text>

  <!-- 底部诚实条款 -->
  <rect x="60" y="500" width="840" height="44" rx="10" class="warn"/>
  <rect x="60" y="500" width="840" height="44" rx="10" fill="none" stroke="#BF4B3A" stroke-width="1.2"/>
  <text x="480" y="518" text-anchor="middle" fill="#BF4B3A" font-size="12" font-weight="700">诚实条款：看门狗保设备十成，救豆子只覆盖短断线（锅炉热惯性大，高温段断线数分钟即回天乏术）</text>
  <text x="480" y="536" text-anchor="middle" fill="#3D2B1F" font-size="11">物理兜底永远在：温控器自身超温报警 + 锅炉电源开关。第一原则：人别离开正在进行的烘焙</text>
</svg>
