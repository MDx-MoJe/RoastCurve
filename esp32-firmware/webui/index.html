<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>烤豆 · RoastBridge</title>
<style>
/* ============ 烤豆家族配色（design-system/Colors.kt 双主题）============ */
:root{
  --bg:#FAF5EB; --card:#FFFBF5; --card2:#F2EBDE; --line:#E8DDD0;
  --tx:#3D2B1F; --tx2:#7A6857; --dim:#A89885;
  --primary:#8B5E3C; --primaryLight:#B8845A;
  --accent:#D4843A; --accentLight:#F0B87A;
  --ok:#5B8C5A; --warn:#D4843A; --err:#BF4B3A;
  --gridLine:#E8DDD0; --gridText:#A89885;
  --svDisp:#8B5E3C; --svPend:#D4843A; --thumb:#B8845A;
  --phaseDrying:#D9EAD3; --phaseMaillard:#FAEFC0; --phaseDev:#EBD9BC;
  --phaseDryingA:#55804B; --phaseMaillardA:#9C7514; --phaseDevA:#96652F;
  --tabH:56px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1A1410; --card:#241D16; --card2:#2E251C; --line:#3A2E24;
    --tx:#E8DDD0; --tx2:#A89885; --dim:#7A6857;
    --primary:#D4A574; --primaryLight:#E8C9A8;
    --accent:#F0A050; --accentLight:#F5C898;
    --ok:#7CB87B; --warn:#F0A050; --err:#E05545;
    --gridLine:#3A2E24; --gridText:#7A6857;
    --svDisp:#E8C9A8; --svPend:#F0A050; --thumb:#E8C9A8;
    --phaseDrying:#243122; --phaseMaillard:#352D14; --phaseDev:#3A2818;
    --phaseDryingA:#93C08A; --phaseMaillardA:#E0C368; --phaseDevA:#D4A574;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  padding-top:env(safe-area-inset-top);
  min-height:100vh; display:flex; flex-direction:column;
  user-select:none; -webkit-user-select:none;
}
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; border-bottom:1px solid var(--line);
}
header h1{font-size:17px; font-weight:600}
header h1 span{color:var(--accent)}
#badge{
  font-size:11px; padding:4px 10px; border-radius:20px;
  background:var(--card2); color:var(--tx2); border:1px solid var(--line);
}
#badge.ok{color:var(--ok); border-color:var(--ok)}
#badge.bad{color:var(--err); border-color:var(--err)}
#badge.wd{color:var(--warn); border-color:var(--warn); animation:blink 1s infinite}
#badge.rec{color:var(--err); border-color:var(--err); animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}
.headBtns{display:flex; gap:6px}
.headBtns button{
  font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid var(--line);
  background:var(--card2); color:var(--tx2); font-family:inherit;
}
.headBtns button:active{background:var(--card)}
#banner{
  display:none; margin:10px 12px 0; padding:10px 14px;
  border-radius:12px; font-size:13px; line-height:1.5;
  background:rgba(191,75,58,.1); border:1px solid var(--err); color:var(--err);
}
#banner.yellow{background:rgba(212,132,58,.1); border-color:var(--warn); color:var(--warn)}
#banner button{
  margin-left:8px; padding:4px 14px; border-radius:20px; font-size:12px;
  background:var(--accent); color:#fff; border:0; font-weight:700;
}
@media (prefers-color-scheme: dark){ #banner button{color:#1A1410} }
main{flex:1; padding:0 0 calc(10px + var(--tabH) + env(safe-area-inset-bottom)); position:relative}
.view{display:none; padding:10px 12px; flex-direction:column; gap:10px}
.view.active{display:flex}
.tempbar{display:flex; gap:10px}
.tcard{
  flex:1; background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:10px 14px;
}
.tcard .lbl{font-size:11px; color:var(--tx2); margin-bottom:2px}
.tcard .val{font-size:30px; font-weight:700; font-variant-numeric:tabular-nums}
.tcard.pv .val{color:var(--accent)}
.tcard.sv .val{color:var(--svDisp)}
.tcard .unit{font-size:13px; color:var(--dim); font-weight:400}
#chartCard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px; position:relative}
#chart{width:100%; height:250px; display:block}
.legend{display:flex; gap:12px; padding:6px 4px 0; font-size:11px; color:var(--tx2); flex-wrap:wrap}
.legend i{display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:4px; vertical-align:middle}
.row{display:flex; gap:10px}
.card{flex:1; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px}
.card .lbl{font-size:11px; color:var(--tx2); margin-bottom:8px}
.card .big{font-size:20px; font-weight:700}
#holderTag.me{color:var(--ok)}
#holderTag.app{color:var(--primary)}
#holderTag.none{color:var(--dim)}
button{font-family:inherit}
#takeBtn{
  margin-top:8px; width:100%; padding:8px; border-radius:50px; border:1px solid var(--accent);
  background:transparent; color:var(--accent); font-size:13px; font-weight:700;
}
#takeBtn:disabled{opacity:.35}
#svRow{display:flex; align-items:center; gap:10px}
#svVal{
  min-width:74px; text-align:center; font-size:22px; font-weight:800;
  color:var(--svDisp); font-variant-numeric:tabular-nums;
  background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:3px 5px;
}
#svVal span{font-size:10px; color:var(--dim); font-weight:400; display:block}
#svVal.pending{border-color:var(--svPend)}
#svSlider{flex:1; -webkit-appearance:none; appearance:none; height:32px; background:transparent}
#svSlider::-webkit-slider-runnable-track{height:6px; border-radius:3px; background:var(--gridLine)}
#svSlider::-webkit-slider-thumb{
  -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
  background:var(--thumb); margin-top:-10px;
}
#svSend{padding:8px 16px; border-radius:50px; border:0; background:var(--primary); color:var(--bg); font-size:14px; font-weight:700}
#svSlider:disabled{opacity:.3}#svSend:disabled{opacity:.3}
/* 阶段统计 */
.phaseRow{display:flex; gap:6px}
.phaseCard{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 10px; text-align:center}
.phaseCard .pn{font-size:11px; font-weight:600}
.phaseCard .pd{font-size:9px; opacity:.7}
.phaseCard .pt{font-size:16px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums}
.phaseCard .pp{font-size:10px; opacity:.8}
/* 风速 */
#fanCard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px}
#fanRow{display:flex; align-items:center; gap:10px}
#fanSlider{flex:1; -webkit-appearance:none; height:32px; background:transparent}
#fanSlider::-webkit-slider-runnable-track{height:6px; border-radius:3px; background:var(--gridLine)}
#fanSlider::-webkit-slider-thumb{
  -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:var(--ok); margin-top:-9px;
}
#fanVal{min-width:52px; text-align:center; font-size:20px; font-weight:800; color:var(--ok)}
/* 事件 dock */
.evbar{
  display:flex; gap:6px; background:var(--card); border:1px solid var(--line);
  border-radius:50px; padding:8px 10px; justify-content:space-between;
}
.evbar button{
  flex:1; padding:9px 2px; border-radius:24px; border:0; font-size:12px; font-weight:700;
  background:var(--card2); color:var(--tx2); font-family:inherit;
}
.evbar button:active{opacity:.7}
.evbar button.charge{background:#4a7c44; color:#fff}
.evbar button.dry{background:#b8912a; color:#fff}
.evbar button.fcs{background:#c2602f; color:#fff}
.evbar button.scs{background:#8f2f22; color:#fff}
.evbar button.drop{background:#3d6a80; color:#fff}
.evbar button:disabled{opacity:.3}
#evLog{margin-top:6px; font-size:11px; color:var(--tx2); line-height:1.7; display:none}
#evLog b{color:var(--primary)}
/* 跟随 */
#followCard .frow{display:flex; gap:8px; margin-top:8px}
#followCard select{
  flex:1; padding:8px; border-radius:12px; border:1px solid var(--line);
  background:var(--card2); color:var(--tx); font-size:13px; font-family:inherit;
}
#followCard button{
  padding:8px 14px; border-radius:50px; border:0; font-size:13px; font-weight:700;
  background:var(--accent); color:#fff;
}
@media (prefers-color-scheme: dark){ #followCard button{color:#1A1410} }
#followCard button.stopf{background:var(--err); color:#fff}
#followCard button:disabled{opacity:.35}
#followInfo{margin-top:6px; font-size:12px; color:var(--tx2); display:none}
#followInfo b{color:var(--accent)}
#stopBtn{
  width:100%; padding:14px; border-radius:50px; border:1px solid var(--err);
  background:rgba(191,75,58,.12); color:var(--err); font-size:16px; font-weight:800; letter-spacing:2px;
}
#stopBtn:active{background:var(--err); color:#fff}
/* 底部 tab */
#tabbar{
  position:fixed; bottom:0; left:0; right:0; height:var(--tabH);
  display:flex; background:var(--card); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); z-index:20;
}
#tabbar button{
  flex:1; border:0; background:transparent; color:var(--dim);
  font-size:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-family:inherit;
}
#tabbar button .ic{font-size:19px; line-height:1}
#tabbar button.active{color:var(--accent)}
/* 记录视图 */
.listCard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.listRow{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
.listRow:last-child{border-bottom:0}
.listRow .t{font-size:14px; font-weight:600}
.listRow .s{font-size:11px; color:var(--dim); margin-top:2px}
.emptyBox{text-align:center; padding:40px 20px; color:var(--dim); font-size:13px; line-height:1.8}
.hidden{display:none!important}
footer{display:none}
</style>
</head>
<body>
<header>
  <h1>烤豆<span>·</span>桥接器</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <span id="badge" style="font-size:11px;padding:4px 10px;border-radius:20px;background:var(--card2);color:var(--tx2);border:1px solid var(--line)">连接中…</span>
    <span id="rssiDot" title="信号强度" style="width:10px;height:10px;border-radius:50%;background:var(--dim);display:inline-block"></span>
    <span id="rssiVal" style="font-size:10px;color:var(--dim);min-width:34px">--</span>
    <button id="btnSettings" style="font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card2);color:var(--tx2)">设置</button>
  </div>
</header>
<div id="banner"></div>
<main>
  <!-- ===== 监控视图 ===== -->
  <div class="view active" id="view-monitor">
    <div class="tempbar">
      <div class="tcard pv"><div class="lbl">豆温 PV</div><div class="val" id="pv">--<span class="unit">°C</span></div></div>
      <div class="tcard sv"><div class="lbl">设定 SV</div><div class="val" id="sv">--<span class="unit">°C</span></div></div>
      <div class="tcard" id="tcTime"><div class="lbl">时间</div><div class="val" id="recTime" style="font-size:22px">0:00</div></div>
    </div>
    <div id="chartCard">
      <canvas id="chart"></canvas>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>PV 豆温</span>
        <span><i style="background:var(--primary)"></i>SV 设定</span>
        <span><i style="background:var(--ok)"></i>RoR</span>
        <span id="legFollow" style="display:none"><i style="border-top:2px dashed var(--warn);background:none;height:0"></i>跟随目标</span>
        <span id="legSim" style="display:none"><i style="background:var(--warn)"></i>SIM</span>
        <span id="legRec" style="display:none"><i style="background:var(--err)"></i>记录中</span>
      </div>
    </div>
    <!-- 阶段统计（入豆后显示）-->
    <div class="phaseRow" id="phaseRow">
      <div class="phaseCard"><div class="pn" style="color:var(--phaseDryingA)">脱水</div><div class="pd" id="phDrying"></div><div class="pt" id="phDryingT">--</div><div class="pp" id="phDryingP"></div></div>
      <div class="phaseCard"><div class="pn" style="color:var(--phaseMaillardA)">美拉德</div><div class="pd" id="phMaillard"></div><div class="pt" id="phMaillardT">--</div><div class="pp" id="phMaillardP"></div></div>
      <div class="phaseCard"><div class="pn" style="color:var(--phaseDevA)">发展</div><div class="pd" id="phDev"></div><div class="pt" id="phDevT">--</div><div class="pp" id="phDevP"></div></div>
    </div>
    <div class="row">
      <div class="card"><div class="lbl">当前主控</div><div class="big" id="holderTag">—</div>
        <button id="takeBtn" onclick="takeover()">接管控制</button></div>
      <div class="card"><div class="lbl">RoR 升温速率</div><div class="big" id="ror">--<span style="font-size:12px;color:var(--dim)"> °C/分</span></div></div>
    </div>
    <div class="card">
      <div class="lbl">设定温度 SV（主控可用，跟随中禁用）</div>
      <div id="svRow">
        <input type="range" id="svSlider" min="30" max="260" value="70" disabled>
        <div id="svVal">--<span>°C</span></div>
        <button id="svSend" onclick="applySv()" disabled>下发</button>
      </div>
    </div>
    <div id="fanCard" class="hidden">
      <div class="lbl">风机转速</div>
      <div id="fanRow">
        <input type="range" id="fanSlider" min="0" max="100" value="0" disabled>
        <div id="fanVal">0%</div>
      </div>
      <div style="font-size:11px;color:var(--tx2);margin-top:4px" id="fanStatus">松手即生效 · 实际 <span id="fanActual">0</span>%</div>
    </div>
    <div id="followCard" class="card">
      <div class="lbl">跟随曲线（固件端执行）</div>
      <div class="frow">
        <select id="followSel"></select>
        <button id="followBtn" onclick="followToggle()">启动跟随</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button onclick="importAlog()" style="flex:1;font-size:12px;padding:6px 10px;border-radius:50px;border:1px solid var(--line);background:var(--card2);color:var(--tx2)">📥 导入曲线（.alog）</button>
        <button onclick="openTplDrawer()" style="flex:1;font-size:12px;padding:6px 10px;border-radius:50px;border:1px solid var(--primary);background:transparent;color:var(--primary)">🖌 绘制曲线</button>
        <button onclick="manageTpls()" style="flex:1;font-size:12px;padding:6px 10px;border-radius:50px;border:1px solid var(--line);background:var(--card2);color:var(--tx2)">🗂 管理模板</button>
      </div>
      <div id="followInfo"></div>
    </div>
    <button id="stopBtn" onclick="estop()">■ 急 停</button>
    <!-- 事件 dock + 记录状态 -->
    <div style="display:flex;align-items:center;gap:8px;padding:2px 2px 0">
      <span style="font-size:11px;color:var(--tx2)" id="recHint">点「入豆」开始记录</span>
      <span style="flex:1"></span>
      <button id="btnSaveRec" onclick="manualSave()" style="display:none;font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--primary);background:transparent;color:var(--primary)">保存本炉</button>
      <button id="btnSaveTpl" onclick="saveAsTemplate()" style="display:none;font-size:12px;padding:6px 14px;border-radius:20px;border:1px solid var(--primary);background:transparent;color:var(--primary)">存为模板</button>
      <button id="btnNextRoast" onclick="resetForNext()" style="display:none;font-size:12px;padding:6px 14px;border-radius:20px;border:0;background:var(--primary);color:var(--bg);font-weight:700">开始下一炉</button>
    </div>
    <div class="evbar" id="evDock">
      <button class="charge" data-ev="CHARGE">入豆</button>
      <button class="dry" data-ev="DRY">黄点</button>
      <button class="fcs" data-ev="FCs">一爆</button>
      <button class="scs" data-ev="SCs">二爆</button>
      <button class="drop" data-ev="DROP">出豆</button>
    </div>
    <div id="evLog"></div>
  </div>

  <!-- ===== 记录视图 ===== -->
  <div class="view" id="view-history">
    <div class="listCard">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 2px 8px">
        <span style="font-weight:700">烘焙记录</span>
        <span style="display:flex;gap:6px">
          <button onclick="exportAll()" style="font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--card2);color:var(--tx2)">导出全部 (zip)</button>
          <button onclick="document.getElementById('fileImport').click()" style="font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--card2);color:var(--tx2)">导入</button>
        </span>
      </div>
      <input type="file" id="fileImport" accept=".zip,.json,application/zip,application/json" style="display:none" onchange="importData(this)">
      <div id="recList"><div class="emptyBox">还没有烘焙记录<br><br>连上桥接器 → 点「入豆」开始记录，<br>「出豆」后自动保存在本机浏览器</div></div>
    </div>
  </div>
</main>
<!-- 底部 tab -->
<div id="tabbar">
  <button class="active" data-view="monitor" onclick="switchView('monitor')"><span class="ic">🔥</span>监控</button>
  <button data-view="history" onclick="switchView('history')"><span class="ic">📋</span>记录</button>
</div>
<script>
"use strict";
/* ================== 常量 ================== */
var WSURL = "ws://" + location.hostname + ":8897";
var LS_REC = "roastcurve_records_v1";
var LS_CFG = "roastcurve_webcfg_v1";
var MAXPTS = 7200;   // 整炉数据上限：2h @1Hz
var REC_POINT_EVERY = 1; // 存点间隔（秒）
var $ = function(id){ return document.getElementById(id); };
var canvas = $("chart"), ctx = canvas.getContext("2d");
var ws = null, isHolder = false, cfgInfo = null, followOn = false;
var svLastKnown = null, svDraft = null, dragGraceUntil = 0, lastEvn = -1;
var hist = [];                 // 实时预览曲线（最近 10 分钟）
var rec = null;                // 当前录制会话 {startedAt, pts:[], events:[], dropped:bool}
var recorderTimer = null;
var lastDataTs = 0, pvPrev = null, tPrev = null, lastRor = null;
var fanLastSent = 0;
/* ================== 通用 ================== */
function badge(cls, txt){
  var el = $("badge");
  if (!el) return;
  el.className = cls; el.textContent = txt;
}
function fmt(v){ return v === null || v === undefined || isNaN(v) ? "--" : Math.round(v); }
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function fmtClock(sec){ sec = Math.floor(sec); var m=Math.floor(sec/60), s=sec%60; return m+":"+(s<10?"0":"")+s; }
function fmtClockLong(sec){ sec = Math.floor(sec); var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h>0? (h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")) : (m+":"+String(s).padStart(2,"0")); }
function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
/* ================== 视图切换 ================== */
function switchView(v){
  document.querySelectorAll(".view").forEach(function(el){ el.classList.remove("active"); });
  $("view-"+v).classList.add("active");
  document.querySelectorAll("#tabbar button").forEach(function(b){ b.classList.toggle("active", b.dataset.view===v); });
  if (v==="history") renderRecList();
}
/* ================== 配置持久化（localStorage）================== */
function loadCfg(){ try{ return JSON.parse(localStorage.getItem(LS_CFG)) || {}; }catch(e){ return {}; } }
function saveCfg(o){ localStorage.setItem(LS_CFG, JSON.stringify(o)); }
function cfgGet(k, d){ var o=loadCfg(); return (k in o)? o[k] : d; }
function cfgSet(k, v){ var o=loadCfg(); o[k]=v; saveCfg(o); }

/* ================== WebSocket ================== */
function connect(){
  try{ ws = new WebSocket(WSURL); }catch(e){ badge("bad","连接失败"); return; }
  ws.onopen = function(){
    badge(rec && rec.active ? "rec" : "ok", rec && rec.active ? "记录中" : "已连接");
    send({type:"get_config"});
    setInterval(function(){ send({type:"ping"}); }, 5000);
  };
  ws.onmessage = function(ev){
    var m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if (m.type === "state") onState(m);
    else if (m.type === "config") onConfig(m);
    else if (m.type === "events") renderEvents(m.list);
  };
  ws.onclose = function(){
    badge("bad","连接断开");
    showBanner("连接已断开，正在重连…", true);
    isHolder = false; setSvUI();
  };
  ws.onerror = function(){ try{ ws.close(); }catch(e){} };
}
function send(o){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

/* ================== 会话录制 ================== */
function recStart(){
  if (rec && rec.active) return;
  hist = [];

/* ================== 极简 ZIP 工具（STORE 无压缩，格式合规，遵守 zip 容器铁律）================== */
var CRC_TABLE = (function(){
  var t = new Int32Array(256);
  for (var n = 0; n < 256; n++){
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }

})();
function crc32(data){
  var c = -1;
  for (var i = 0; i < data.length; i++) c = CRC_TABLE[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}
function str2bytes(s){ var out = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i) & 0xFF; return out; }
function u16(v){ return [v & 0xFF, (v >>> 8) & 0xFF]; }
function u32(v){ return [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]; }
function concatBytes(a, b){ var o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; }
/* 打包 {name, data(Uint8Array)}[] → Blob(zip, STORE) */
function zipStoreBlob(files){
  var chunks = [], central = [];
  var offset = 0;
  files.forEach(function(f){
    var nameB = str2bytes(f.name);
    var crc = crc32(f.data);
    var local = [];
    // Local file header: sig 0x04034b50 ver20 flag0 method0 mtime/mdate0
    local = local.concat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0));
    local = local.concat(u32(crc), u32(f.data.length), u32(f.data.length), u16(nameB.length), u16(0));
    chunks.push(new Uint8Array(local), nameB, f.data);
    var cen = [];
    cen = cen.concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0));
    cen = cen.concat(u32(crc), u32(f.data.length), u32(f.data.length), u16(nameB.length), u16(0), u16(0), u16(0), u16(0));
    cen = cen.concat(u32(0), u32(offset));
    central.push(new Uint8Array(cen), nameB);
    offset += 30 + nameB.length + f.data.length;
  });
  var centralSize = central.reduce(function(s, c){ return s + c.length; }, 0);
  var eocd = u32(0x06054b50).concat(u16(0), u16(0), u16(files.length), u16(files.length), u32(centralSize), u32(offset), u16(0));
  central.forEach(function(c){ chunks.push(c); });   // ← 关键：central directory 必须写进文件
  chunks.push(new Uint8Array(eocd));

  for (var i = 1; i < chunks.length; i++) full = concatBytes(full, chunks[i]);

}
/* 解 STORE zip → {name: Uint8Array}；遇 DEFLATE 条目抛错提示 */
function unzipStore(buf){
  var dv = new DataView(buf);
  var out = {};
  var pos = 0;
  while (pos + 4 <= buf.byteLength && dv.getUint32(pos, true) === 0x04034b50){
    var method = dv.getUint16(pos + 8, true);
    var csize = dv.getUint32(pos + 18, true);
    var usize = dv.getUint32(pos + 22, true);
    var nlen = dv.getUint16(pos + 26, true);
    var elen = dv.getUint16(pos + 28, true);
    var name = '';
    for (var i = 0; i < nlen; i++) name += String.fromCharCode(dv.getUint8(pos + 30 + i));
    var dataStart = pos + 30 + nlen + elen;
    if (method !== 0) throw new Error("zip 内含压缩条目（" + name + "），请用未压缩 zip 或直接选 json");
    out[name] = new Uint8Array(buf, dataStart, usize);
    pos = dataStart + csize;
  }

}

function downloadBlob(filename, blob){

function download(filename, text){

function drawMini(cv, r){
  var pts = r.pts || [];
  if (!pts.length) return;
  var ctx2 = cv.getContext("2d");
  var w = cv.width, h = cv.height;
  ctx2.clearRect(0,0,w,h);
  var t0 = pts[0].t, t1 = pts[pts.length-1].t;
  var lo=1000, hi=-1000;
  pts.forEach(function(p){ lo=Math.min(lo,p.pv,p.sv); hi=Math.max(hi,p.pv,p.sv); });
  var pad=(hi-lo)*.1+2; lo-=pad; hi+=pad;
  var X=function(t){ return 8+(t-t0)/(t1-t0||1)*(w-16); };
  var Y=function(v){ return 8+(1-(v-lo)/(hi-lo))*(h-16); };
  // 事件点
  function line(key,c){
    ctx2.strokeStyle=c; ctx2.lineWidth=1.5; ctx2.beginPath();
    pts.forEach(function(p,i){ var x=X(p.t),y=Y(p[key]); i?ctx2.lineTo(x,y):ctx2.moveTo(x,y); });
    ctx2.stroke();
  }
  line("sv", getCss("--primary"));
  line("pv", getCss("--accent"));
  // 事件刻度
  (r.events||[]).forEach(function(e){
    var x=X(e.t), y=Y(e.pv);
    ctx2.fillStyle = e.ev==="CHARGE"?"#4a7c44":e.ev==="DROP"?"#3d6a80":"#c2602f";
    ctx2.beginPath(); ctx2.arc(x,y,4,0,7); ctx2.fill();
  });
}

/* ================== 图表绘制 ================== */
function draw(){
  var dpr = window.devicePixelRatio||1;
  var w = canvas.clientWidth, h = canvas.clientHeight;
  if (w===0 || h===0) return;
  if (canvas.width !== w*dpr){ canvas.width=w*dpr; canvas.height=h*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  var padL=34, padR=10, padT=8, padB=16;
  var cw=w-padL-padR, chh=h-padT-padB;
  if (hist.length<2) return;
  var t0=hist[0].t, t1=hist[hist.length-1].t;
  if (t1-t0<30) t1=t0+30;
  var lo=20, hi=100;
  for (var i=0;i<hist.length;i++){
    lo=Math.min(lo,hist[i].pv,hist[i].sv);
    if(hist[i].ft!==null&&hist[i].ft!==undefined){ lo=Math.min(lo,hist[i].ft); hi=Math.max(hi,hist[i].ft); }
    hi=Math.max(hi,hist[i].pv,hist[i].sv);
  }
  var pad=(hi-lo)*0.12+2; lo-=pad; hi+=pad;
  function X(t){ return padL+(t-t0)/(t1-t0)*cw; }
  function Y(v){ return padT+(1-(v-lo)/(hi-lo))*chh; }
  ctx.strokeStyle=getCss("--gridLine"); ctx.fillStyle=getCss("--gridText");
  ctx.font="10px -apple-system"; ctx.lineWidth=1;
  for(var g=0;g<=4;g++){ var v=lo+(hi-lo)*g/4, y=Y(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillText(Math.round(v),4,y+3);
  }
  ctx.fillText("-"+Math.round(t1-t0)+"s", padL, h-5);
  ctx.fillText("now", w-padR-22, h-5);
  var hasFt=hist.some(function(p){ return p.ft!==null&&p.ft!==undefined; });
  if(hasFt){
    ctx.strokeStyle=getCss("--warn"); ctx.lineWidth=1.2; ctx.setLineDash([4,3]);
    ctx.beginPath(); var started=false;
    for(var i=0;i<hist.length;i++){ if(hist[i].ft===null||hist[i].ft===undefined) continue;
      var x=X(hist[i].t), y=Y(hist[i].ft);
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y); }
    ctx.stroke(); ctx.setLineDash([]);
  }
  function line(key,color,width){ ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath();
    var started=false;
    for(var i=0;i<hist.length;i++){ var x=X(hist[i].t),y=Y(hist[i][key]);
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y); }
    ctx.stroke();
  }
  line("sv",getCss("--primary"),1.5);
  line("pv",getCss("--accent"),2.5);

  // === 事件标记点（入豆/黄点/一爆/出豆，带炉内时间+温度）===
  drawEventMarks(X, Y, t0, t1, w);
}

var EV_COLOR = {CHARGE:"#4a7c44", DRY:"#b8912a", FCs:"#c2602f", SCs:"#8f2f22", DROP:"#3d6a80"};
var EV_SHORT = {CHARGE:"入豆", DRY:"黄点", FCs:"一爆", FCe:"一爆毕", SCs:"二爆", SCe:"二爆毕", DROP:"出豆"};
function drawEventMarks(X, Y, t0, t1, w){
  if (!rec || !rec.active) return;
  var evs = rec.events || [];
  if (!evs.length) return;
  var chargeUp = rec.chargeUptime;
  if (chargeUp === undefined || chargeUp === null) return;
  // 事件按时间排，画点 + 错开标注
  var drawn = [];
  evs.forEach(function(ev){
    var evUp = chargeUp + ev.t;         // 事件在 uptime 轴的位置
    if (evUp < t0 - 5 || evUp > t1 + 5) return;   // 出窗不画
    var x = X(evUp);
    var y = Y(ev.pv !== undefined && ev.pv ? ev.pv : curPv);
    var color = EV_COLOR[ev.ev] || "#8B5E3C";
    // 空心圆 + 实心核
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 7); ctx.fill();
    drawn.push({x:x, y:y, color:color, up:evUp, evCode:ev.ev, evTime:ev.t, evPv:ev.pv});
  });
  // 标注文字：事件名 mm:ss 温度（简单上下交替防重叠）
  ctx.font = "bold 10px -apple-system";
  ctx.textAlign = "left";
  drawn.forEach(function(d, i){
    var label = (EV_SHORT[d.evCode]||d.evCode) + " " + fmtClock(Math.max(0, Math.round(d.evTime))) + " " + fmt(d.evPv) + "°";
    var upOffset = (i % 2 === 0) ? -16 : 22;   // 上下交替
    var tx = d.x + 8;
    if (tx + 70 > w) tx = d.x - 78;            // 靠近右缘左置
    var ty = d.y + upOffset;
    // 标签底色条（可读性）
    var tw = ctx.measureText(label).width + 6;
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(tx - 3, ty - 9, tw, 13);
    ctx.fillStyle = d.color;
    ctx.fillText(label, tx, ty);
  });
  ctx.textAlign = "start";
}

function downsampleCurve(pts, step){
  var out = []; var next = 0;
  for (var i = 0; i < pts.length; i++){
    if (pts[i].t >= next){ out.push({t:Math.round(pts[i].t), pv:Math.round(pts[i].pv)}); next += step; }
  }
  return out;
}
/* 记录点 → 跟随 5s 目标数组（含首尾封齐） */
function curveToFollowPoints(pts){
  if (!pts || !pts.length) return [];
  var out = [];
  var t0 = pts[0].t, t1 = pts[pts.length-1].t;
  // 取温度：按时间线性插值在 pts 上
  for (var t = 0; t <= t1; t += 5){
    // 找区间
    var v;
    if (t <= t0) v = pts[0].pv;
    else if (t >= t1) v = pts[pts.length-1].pv;
    else {
      var a = pts[0];
      for (var i = 0; i < pts.length; i++){ if (pts[i].t >= t){ break; } a = pts[i]; }
      var b = pts[i] || a;
      var span = (b.t - a.t) || 1;
      v = a.pv + (b.pv - a.pv) * (t - a.t) / span;
    }
    out.push(Math.max(0, Math.min(250, Math.round(v))));
  }
  return out;
}
/* 模板锚点 → 5s 目标（锚点间线性） */
function anchorsToFollowPoints(anchors){
  if (!anchors || anchors.length < 2) return [];
  var sorted = anchors.slice().sort(function(a,b){ return a.t - b.t; });
  var t1 = sorted[sorted.length-1].t;
  var out = [];
  for (var t = 0; t <= t1; t += 5){
    var i = 0;
    while (i < sorted.length-1 && sorted[i+1].t < t) i++;
    var a = sorted[i], b = sorted[i+1] || a;
    var span = (b.t - a.t) || 1;
    var v = a.bt + (b.bt - a.bt) * (t - a.t) / span;
    out.push(Math.max(0, Math.min(250, Math.round(v))));
  }
  return out;
}

}
function alogTitle(content){
  var m = content.match(/'title':\s*'([^']*)'/);
  if (!m) return null;
  // 处理 \uXXXX
  try{ return m[1].replace(/\\u([0-9a-fA-F]{4})/g, function(a,b){ return String.fromCharCode(parseInt(b,16)); }); }catch(e){ return m[1]; }
}
function parseAndAddAlog(content, fname){
  var timex = floatList(content, "timex");
  var bt = floatList(content, "temp1");
  if (!timex.length || bt.length < 20 || bt.length < 10){
    alert("解析失败：没找到有效的 timex/temp1 曲线数据（可能不是标准 .alog）");
    return;
  }
  // 对齐长度
  var n = Math.min(timex.length, bt.length);
  var pts = [];
  for (var i = 0; i < n; i++){ if (bt[i] >= 0) pts.push({t:Math.round(timex[i]), pv:Math.round(bt[i])}); }
  // 只保留入豆后（首个连续段），去掉尾部 0
  var start = 0;
  while (start < pts.length-2 && pts[start].t < 0) start++;
  while (pts.length > 0 && pts[pts.length-1].t > (pts[0].t + 2400)) pts.pop();
  if (pts.length < 20){ alert("有效曲线点太少（<20）"); return; }
  // 锚点：computed 事件
  var anchors = [];
  var chargeBt = floatField(content, "CHARGE_BT");
  var dropT = floatField(content, "DROP_time");
  var lastT = pts[pts.length-1].t;
  // 归一化时间：首个点 t0
  var t0 = pts[0].t;
  var rel = function(t){ return Math.max(0, Math.round(t - t0)); };
  if (chargeBt !== null) anchors.push({t:0, bt:Math.round(chargeBt), label:"入豆"});
  var dryT = floatField(content, "DRY_time");
  var dryBt = floatField(content, "DRY_BT");
  if (dryT !== null && dryBt !== null) anchors.push({t:rel(dryT), bt:Math.round(dryBt), label:"脱水"});
  var fcsT = floatField(content, "FCs_time");
  var fcsBt = floatField(content, "FCs_BT");
  if (fcsT !== null && fcsBt !== null) anchors.push({t:rel(fcsT), bt:Math.round(fcsBt), label:"一爆"});
  if (dropT !== null) anchors.push({t:rel(dropT), bt:Math.round(pts[pts.length-1].pv), label:"出豆"});
  // 归一化 pts 时间（相对入豆）
  var normPts = pts.map(function(p){ return {t:Math.round(p.t - t0), pv:p.pv}; }).filter(function(p){ return p.t >= 0; });
  // 出豆截断
  var endT = dropT !== null ? rel(dropT) : normPts[normPts.length-1].t;
  normPts = normPts.filter(function(p){ return p.t <= endT; });
  var title = alogTitle(content) || fname.replace(/\.alog$/i,"");
  var tpl = {
    id: "tpl_" + Date.now(),
    name: title.slice(0,40),
    src: "alog",
    createdAt: Date.now(),
    points: downsampleCurve(normPts, 5),
    anchors: anchors,
    sourceFile: fname
  };
  var list = loadTpls(); list.unshift(tpl); saveTpls(list);
  alert("导入成功「" + tpl.name + "」\n" + tpl.points.length + " 个目标点" + (anchors.length ? " · " + anchors.length + " 个事件锚点" : ""));
  refreshFollowSelect();
}

/* 模板删除（管理：简单列出确认删） */
function manageTpls(){
  var list = loadTpls();
  if (!list.length){ alert("还没有模板。\n\n① 烘焙完成后点「存为模板」\n② 在跟随选择器选「导入 .alog 曲线…」"); return; }
  var names = list.map(function(t,i){ return (i+1) + ". " + t.name; }).join("\n");
  var idx = prompt("当前模板：\n\n" + names + "\n\n输入编号删除（取消=返回）", "");
  if (!idx) return;
  var i = parseInt(idx,10) - 1;
  if (isNaN(i) || i < 0 || i >= list.length){ alert("编号无效"); return; }
  var name = list[i].name;
  if (!confirm("删除模板「" + name + "」？")) return;
  list.splice(i,1); saveTpls(list);
  alert("已删除"); refreshFollowSelect();
}
function followToggle(){
  if (followOn){ send({type:"follow_stop"}); return; }
  var sel = document.getElementById("followSel");
  var val = sel.value;
  var pts = null;
  if (val.indexOf("tpl_") === 0){
    var idx = parseInt(val.slice(4),10);
    var tpls = loadTpls();
    var tpl = tpls[idx];
    if (!tpl){ alert("模板不存在"); return; }
    // 模板源：有 points 直接用它，有 anchors 用锚点插值
    pts = tpl.points && tpl.points.length > 10
        ? curveToFollowPoints(tpl.points)
        : (tpl.anchors && tpl.anchors.length >= 2 ? anchorsToFollowPoints(tpl.anchors) : null);
    if (!pts){ alert("模板数据不足"); return; }
    send({type:"follow_start", points:pts});
    showFollowInfo(tpl.name, pts.length);
    return;
  }
  // 内置示例
  pts = buildCurve(val);
  var label = val === "ramp" ? "线性爬温" : "爬温+恒温";
  send({type:"follow_start", points:pts});
  showFollowInfo(label, pts.length);
}
function showFollowInfo(name, n){
  document.getElementById("followInfo").style.display = "block";
  document.getElementById("followInfo").innerHTML = "跟随「" + name + "」· " + n + " 点（" + Math.round(n*5/60*10)/10 + " 分钟）";
}

function buildCurve(kind){
  var pts=[]; var i;
  function seg(f,t,m){ var n=Math.round(m*60/5); for(var j=1;j<=n;j++) pts.push(Math.round(f+(t-f)*j/n)); }
  if(kind==="ramp"){ for(i=0;i<5;i++) pts.push(25); seg(25,200,7.5); }
  else if(kind==="soak"){ for(i=0;i<3;i++) pts.push(25); seg(25,150,4); for(i=0;i<60;i++) pts.push(150); }
  return pts.slice(0,720);
}

/* ================== 模板自绘器（轻量：点加锚点 / 拖动调点 / 点已选删点）================== */
var tplDraw = null;  // {anchors:[], sel:-1, drag:-1, maxT:1200, canvas, ctx, name}
function openTplDrawer(){
  if (followOn){ alert("跟随运行中请先停止，再绘制曲线"); return; }
  // 初始 3 锚点：起点室温 / 中段 / 终点（典型 12min 到 205°C）
  var anchors = [
    {t:0, bt:25},
    {t:360, bt:140},
    {t:720, bt:205}
  ];
  var name = "手绘曲线 " + (loadTpls().length + 1);
  var html =
    '<div style="font-weight:700;margin-bottom:4px">🖌 绘制豆温曲线</div>' +
    '<div style="font-size:11px;color:var(--tx2);margin-bottom:2px">目标豆温 BT（跟随中温控器沿此升温 · 点空白加锚点 / 拖动调点 / 点已选中锚点删除）</div>' +
    '<div style="font-size:11px;color:var(--tx2);margin-bottom:8px">曲线为线性插值，锚点间温度随时间匀速变化</div>' +
    '<canvas id="tplCv" style="width:100%;height:230px;border-radius:12px;background:var(--card2);border:1px solid var(--line);touch-action:none"></canvas>' +
    '<div id="tplCur" style="font-size:12px;color:var(--tx);margin-top:6px;min-height:16px"></div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px">' +
      '<input id="tplName" value="' + name + '" style="flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--tx);font-size:14px">' +
      '<span id="tplCount" style="font-size:11px;color:var(--tx2);white-space:nowrap"></span>' +
    '</div>' +
    '<div style="display:flex;gap:8px;margin-top:12px">' +
      '<button id="tplCancel" style="flex:1;padding:9px;border-radius:50px;border:1px solid var(--line);background:var(--card2);color:var(--tx2)">取消</button>' +
      '<button id="tplSave" style="flex:1;padding:9px;border-radius:50px;border:0;background:var(--primary);color:var(--bg);font-weight:700">存为模板</button>' +
    '</div>';
  showSheet(html);
  var cv = document.getElementById("tplCv");
  var d = tplDraw = {
    anchors: anchors, sel: -1, drag: -1, maxT: 1200,  // 默认 20 分钟上限
    cv: cv, ctx: cv.getContext("2d"),
    name: document.getElementById("tplName"),
    count: document.getElementById("tplCount")
  };
  cv.addEventListener("pointerdown", onTplDown);
  cv.addEventListener("pointermove", onTplMove);
  cv.addEventListener("pointerup", onTplUp);
  cv.addEventListener("pointercancel", onTplUp);
  document.getElementById("tplCancel").onclick = closeTopOverlay;
  document.getElementById("tplSave").onclick = saveDrawnTpl;
  d.name.addEventListener("input", function(){ if(d){ d.name.value = d.name.value.replace(/[<>]/g,""); } });
  drawTplCanvas();
}
function tplXY(e){
  var d = tplDraw; if (!d) return null;
  var r = d.cv.getBoundingClientRect();
  var x = (e.clientX - r.left) / r.width;
  var y = (e.clientY - r.top) / r.height;
  var t = Math.max(0, Math.min(d.maxT, Math.round(x * d.maxT / 5) * 5));   // 5s 对齐（跟随粒度）
  var bt = Math.max(5, Math.min(250, Math.round((1 - y) * 250 / 5) * 5));  // 5°C 对齐
  return {t:t, bt:bt};
}
function onTplDown(e){
  var d = tplDraw; if (!d) return;
  var p = tplXY(e); if (!p) return;
  e.preventDefault();
  // 命中已有锚点（15px 容差）？
  var hit = -1, best = 30;
  var rect = d.cv.getBoundingClientRect();
  d.anchors.forEach(function(a, i){
    var ax = rect.left + a.t / d.maxT * d.cv.clientWidth, ay = rect.top + (1 - a.bt / 250) * d.cv.clientHeight;
    var dx = e.clientX - ax, dy = e.clientY - ay;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < best){ best = dist; hit = i; }
  });
  if (hit >= 0){
    if (d.sel === hit){  // 再点已选中 → 删除
      d.anchors.splice(hit, 1); d.sel = -1;
      if (d.anchors.length < 2) d.anchors = [{t:0, bt:25}, {t:600, bt:200}];  // 保底至少 2 点
      drawTplCanvas(); return;
    }
    d.sel = hit; d.drag = hit;
    drawTplCanvas(); return;
  }
  // 空白处加锚点
  d.anchors.push({t:p.t, bt:p.bt});
  d.sel = d.anchors.length - 1; d.drag = d.sel;
  drawTplCanvas();
}
function onTplMove(e){
  var d = tplDraw; if (!d || d.drag < 0) return;
  var p = tplXY(e); if (!p) return;
  e.preventDefault();
  var a = d.anchors[d.drag];
  if (!a) return;
  // 拖动时间钳位到相邻锚点之间（保持时间单调）
  var sortedIdx = d.anchors.map(function(x,i){ return i; }).sort(function(i,j){ return d.anchors[i].t - d.anchors[j].t; });
  var pos = sortedIdx.indexOf(d.drag);
  var tMin = pos > 0 ? d.anchors[sortedIdx[pos-1]].t : 0;
  var tMax = pos < sortedIdx.length-1 ? d.anchors[sortedIdx[pos+1]].t : d.maxT;
  a.t = Math.max(tMin, Math.min(tMax, p.t));
  a.bt = p.bt;
  drawTplCanvas();
}
function onTplUp(){ var d = tplDraw; if (d) d.drag = -1; }
function drawTplCanvas(){
  var d = tplDraw; if (!d) return;
  var cv = d.cv, ctx = d.ctx;
  var w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== w*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  // 阶段色带（脱水/美拉德/发展，半透明）
  ctx.fillStyle = "rgba(90,140,90,.10)"; ctx.fillRect(0, 0, w*.45, h);
  ctx.fillStyle = "rgba(200,160,60,.10)"; ctx.fillRect(w*.45, 0, w*.30, h);
  ctx.fillStyle = "rgba(150,90,50,.12)"; ctx.fillRect(w*.75, 0, w*.25, h);
  // 网格
  ctx.strokeStyle = getCss("--gridLine"); ctx.fillStyle = getCss("--gridText");
  ctx.font = "10px -apple-system"; ctx.lineWidth = 1;
  for (var t = 0; t <= d.maxT; t += 120){
    var gx = t / d.maxT * w;
    ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke();
    ctx.fillText(Math.round(t/60) + "m", gx+3, h-4);
  }
  for (var gb = 0; gb <= 250; gb += 50){
    var gy = (1 - gb/250) * h;
    ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke();
    ctx.fillText(gb + "°", 3, gy-2);
  }
  // 锚点折线
  var sorted = d.anchors.slice().sort(function(a,b){ return a.t - b.t; });
  if (sorted.length >= 2){
    ctx.strokeStyle = getCss("--accent"); ctx.lineWidth = 2.5; ctx.lineJoin="round";
    ctx.beginPath();
    sorted.forEach(function(a, i){
      var px = a.t/d.maxT*w, py = (1 - a.bt/250)*h;
      if (i === 0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    });
    ctx.stroke();
  }
  // 锚点圆点 + 数值标签
  var labels = [];   // {x,y,up,text} 记录标签位置做简单碰撞
  sorted.forEach(function(a){
    var orig = d.anchors.indexOf(a);
    var px = a.t/d.maxT*w, py = (1 - a.bt/250)*h;
    var isSel = orig === d.sel;
    // 圆点
    ctx.beginPath(); ctx.arc(px, py, isSel ? 7.5 : 5.5, 0, 7);
    ctx.fillStyle = isSel ? getCss("--primary") : getCss("--accentLight");
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = isSel ? getCss("--err") : getCss("--primary"); ctx.stroke();
    // 标签（每点都显示：温度/时间；选中加粗描边）
    var tlabel = fmtClock(a.t);
    var txt = fmt(a.bt) + "° " + tlabel;
    ctx.font = (isSel ? "bold " : "") + "9px -apple-system";
    ctx.textAlign = "center";
    var tw = ctx.measureText(txt).width;
    var above = (py > 40);   // 靠上方的点标签放下面，防溢出顶边
    var ly = above ? py - 12 : py + 18;
    ctx.fillStyle = isSel ? getCss("--err") : getCss("--tx2");
    ctx.fillText(txt, px, ly);
    ctx.textAlign = "left";
    labels.push({px:px, ly:ly, tw:tw});
  });
  // 详情行：当前选中/拖动的锚点
  var curTxt = "";
  if (d.sel >= 0 && d.anchors[d.sel]){
    var c = d.anchors[d.sel];
    curTxt = "锚点 " + (d.sel+1) + " · " + fmtClock(c.t) + " · " + fmt(c.bt) + "°C" + (d.drag >= 0 ? " （拖动中）" : "（再点删除）");
  }
  var curEl = document.getElementById("tplCur");
  if (curEl) curEl.innerHTML = curTxt ? "<b style='color:var(--primary)'>●</b> " + curTxt : '<span style="color:var(--tx2)">点击曲线添加锚点，拖动可调整</span>';
  d.count.innerHTML = d.anchors.length + " 点 · 总时长 " + fmtClock(sorted[sorted.length-1].t);
}
function saveDrawnTpl(){
  var d = tplDraw; if (!d) return;
  var name = d.name.value.trim() || ("手绘曲线 " + (loadTpls().length+1));
  var sorted = d.anchors.slice().sort(function(a,b){ return a.t - b.t; });
  if (sorted.length < 2){ alert("至少需要 2 个锚点"); return; }
  var tpl = {
    id: "tpl_" + Date.now(),
    name: name,
    src: "drawn",
    createdAt: Date.now(),
    maxT: d.maxT,
    // 锚点即模板数据；跟随端 anchorsToFollowPoints 线性插值。首点常为入豆室温
    anchors: sorted.map(function(a){ return {t:a.t, bt:a.bt, label:(a.t===0?"入豆":"")}; })
  };
  var list = loadTpls(); list.unshift(tpl); saveTpls(list);
  closeTopOverlay();
  alert("已保存模板「" + name + "」（" + sorted.length + " 锚点）");
  refreshFollowSelect();
  var sel = document.getElementById("followSel");
  if (sel) sel.value = "tpl_0";
  tplDraw = null;
}

boot();
</script>
